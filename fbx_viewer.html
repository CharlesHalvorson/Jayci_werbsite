<!DOCTYPE html>
<html>
<head>
    <title>FBX Model Viewer</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.138.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.138.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let mixer;
        const clock = new THREE.Clock();

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xa0a0a0);
        // scene.fog = new THREE.Fog( 0xa0a0a0, 200, 1000 );

        // Camera setup
        const camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 1, 2000 );
        camera.position.set( 100, 1000, 100 );

        // Renderer setup
        const renderer = new THREE.WebGLRenderer( { antialias: true } );
        renderer.setPixelRatio( window.devicePixelRatio );
        renderer.setSize( window.innerWidth, window.innerHeight );
        renderer.shadowMap.enabled = true;
        document.body.appendChild( renderer.domElement );

        // Controls
        const controls = new OrbitControls( camera, renderer.domElement );
        controls.target.set( 0, 100, 0 );
        controls.update();

        // Lighting
        const hemiLight = new THREE.HemisphereLight( 0xffffff, 0x0000ff );
        hemiLight.position.set( 0, 200, 0 );
        scene.add( hemiLight );

        const dirLight = new THREE.DirectionalLight( 0xff0000 );
        dirLight.position.set( 0, 200, 100 );
        dirLight.castShadow = true;
        dirLight.shadow.camera.top = 180;
        dirLight.shadow.camera.bottom = -100;
        dirLight.shadow.camera.left = -120;
        dirLight.shadow.camera.right = 120;
        scene.add( dirLight );

        // Ground
        const ground = new THREE.Mesh( new THREE.PlaneGeometry( 2000, 2000 ), new THREE.MeshPhongMaterial( { color: 0x999999, depthWrite: false } ) );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add( ground );

        // Grid and Axes
        const grid = new THREE.GridHelper( 2000, 20, 0x000000, 0x000000 );
        grid.material.opacity = 1;
        grid.material.transparent = false;
        scene.add( grid );

        const axesHelper = new THREE.AxesHelper( 150 );
        scene.add( axesHelper );

        // FBX Loader
        const loader = new FBXLoader();
        loader.load( '3d/Jog In Circle.fbx', function ( object ) {

            console.log('Model loaded:', object); // Log the loaded object

            mixer = new THREE.AnimationMixer( object );

            if (object.animations.length > 0) {
                const action = mixer.clipAction( object.animations[0] );
                action.play();
                console.log('Animation playing.');
            } else {
                console.log('No animations found in the model.');
            }

            object.traverse( function ( child ) {
                if ( child.isMesh ) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            } );
            
            // Center and scale the model
            const box = new THREE.Box3().setFromObject(object);
            const center = box.getCenter(new THREE.Vector3());
            object.position.sub(center); // Center the model
            
            scene.add( object );
            console.log('Model added to the scene.');


        }, undefined, function ( error ) {

            console.error( 'An error happened while loading the model:', error );

        } );

        // Animation loop
        const animate = function () {
            requestAnimationFrame( animate );

            if (mixer) {
                mixer.update( clock.getDelta() );
            }

            renderer.render( scene, camera );
        };

        animate();

        // Handle window resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
